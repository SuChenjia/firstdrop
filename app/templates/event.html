<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>事件详情 · FirstDrop</title>
<style>
  :root{
    --bg:#0a0e1a; --card:#131b2e; --card2:#1a2339; --line:#24304a;
    --txt:#e9eef8; --dim:#8a97b5; --accent:#5b8cff; --accent2:#7c5cff;
    --gold:#f0b35e; --green:#4ade80;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh}

  /* Lang switch */
  .lang-switch{position:fixed; top:20px; right:24px; z-index:20; display:inline-flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:7px 14px; cursor:pointer;
    color:var(--dim); font:600 13px/1 inherit; transition:border-color .2s, color .2s}
  .lang-switch:hover{border-color:var(--accent); color:var(--txt)}
  .lang-switch .cur{color:var(--accent)}

  .wrap{max-width:800px; margin:0 auto; padding:24px}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--dim); text-decoration:none; font-size:13px; margin-bottom:24px}
  .back:hover{color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; margin-bottom:20px}
  .card::before{content:''; display:block; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:18px 18px 0 0; margin:-28px -28px 20px}
  h1{font-size:24px; font-weight:800; line-height:1.35; margin-bottom:16px}
  .meta{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px}
  .meta-item{font-size:13px; color:var(--dim); display:flex; align-items:center; gap:6px}
  .meta-item b{color:var(--txt); font-weight:600}
  .plat-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .plat-tag{font-size:12px; padding:4px 12px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--dim)}
  .heat{display:flex; align-items:center; gap:12px; font-size:14px; margin-bottom:20px}
  .heat-bar{flex:1; height:8px; background:var(--card2); border-radius:4px; overflow:hidden}
  .heat-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:4px}
  .heat-num{color:var(--accent); font-weight:700; font-size:18px; min-width:60px; text-align:right}
  .section-title{font-size:14px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; margin-top:24px; padding-top:20px; border-top:1px solid var(--line)}
  .member{display:flex; align-items:center; gap:12px; padding:12px; background:var(--card2); border-radius:10px; margin-bottom:8px}
  .member-head{display:flex; align-items:center; gap:12px; padding:0 12px 6px; border-bottom:1px solid var(--line); margin-bottom:8px}
  .member-head span{font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.5px}
  .member-plat{font-size:12px; color:var(--dim); min-width:80px}
  .member-title{flex:1; font-size:13px; line-height:1.4}
  .member-hot{color:var(--accent); font-weight:600; font-size:13px; min-width:60px; text-align:right}
  .member-pos{color:var(--dim); font-size:12px; min-width:40px; text-align:right}
  .trace-box{background:var(--card2); border-left:3px solid var(--green); border-radius:10px; padding:16px; margin-top:12px}
  .trace-label{font-size:11px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px}
  .trace-title{font-size:15px; font-weight:700; margin-bottom:8px}
  .trace-meta{font-size:13px; color:var(--dim); line-height:1.7}
  .trace-meta a{color:var(--accent); text-decoration:none; border-bottom:1px dashed var(--accent)}
  .trace-excerpt{margin-top:10px; font-size:13px; color:var(--dim); line-height:1.7; padding:12px; background:var(--card); border-radius:8px}
  .trace-excerpt-label{display:block; font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px}
  .loading{padding:60px; text-align:center; color:var(--dim)}
  .loading::after{content:''; display:inline-block; width:20px; height:20px; margin-left:8px;
    border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:40px; text-align:center; color:var(--dim); background:var(--card); border-radius:16px; border:1px dashed var(--line)}
</style>
</head>
<body>
<button class="lang-switch" id="langSwitch" title="Language"><span class="cur" id="langCur">中文</span><span id="langNext">/ EN</span></button>
<div class="wrap">
  <a class="back" id="back-link" href="/demo">← 返回 Demo 首页</a>
  <div id="content" class="loading">加载中</div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null ? '—' : Number(n).toLocaleString('en-US');

const PLAT_COLORS = {
  weibo:'#e6162d', baidu:'#306eff', zhihu:'#0084ff', toutiao:'#f04142',
  bilibili:'#fb7299', '36kr':'#12b7b5', wallstreetcn:'#1c4c9c'
};

// ---- 极简 i18n：界面框架双语，事件标题/平台名保留中文原文 ----
const I18N = {
  zh: {
    htmlLang:'zh-CN',
    docTitle:'事件详情 · FirstDrop',
    back:'← 返回 Demo 首页',
    loading:'加载中',
    missingId:'缺少事件 ID',
    loadFail:'加载失败：',
    coveredPlatforms:'覆盖平台',
    topicCount:'话题条目',
    bestPosition:'最佳名次',
    eventId:'事件 ID',
    peakHeat:'峰值热度',
    secTrace:'首发溯源',
    traceLabel:'最早发声点',
    source:'来源：',
    time:'时间：',
    unknownTime:'时间未知',
    unknownSite:'未知',
    confidence:'置信度',
    viewSnapshot:'查看快照',
    excerptLabel:'正文摘要',
    secMembers:'各平台榜单表现',
    colPlatform:'平台',
    colTitle:'标题',
    colHeat:'热度',
    colRank:'名次',
    locale:'zh-CN',
    label:'中文'
  },
  en: {
    htmlLang:'en',
    docTitle:'Event detail · FirstDrop',
    back:'← Back to Demo home',
    loading:'Loading',
    missingId:'Missing event ID',
    loadFail:'Failed to load: ',
    coveredPlatforms:'Platforms',
    topicCount:'Topic entries',
    bestPosition:'Best rank',
    eventId:'Event ID',
    peakHeat:'Peak heat',
    secTrace:'First-source tracing',
    traceLabel:'EARLIEST POST',
    source:'Source: ',
    time:'Time: ',
    unknownTime:'Time unknown',
    unknownSite:'Unknown',
    confidence:'Confidence',
    viewSnapshot:'View snapshot',
    excerptLabel:'Summary',
    secMembers:'Platform ranking performance',
    colPlatform:'Platform',
    colTitle:'Title',
    colHeat:'Heat',
    colRank:'Rank',
    locale:'en-US',
    label:'English'
  }
};

let LANG = localStorage.getItem('firstdrop_lang')
  || ((navigator.language||'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const T = () => I18N[LANG];

function renderStatic(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  $('#back-link').textContent = t.back;
  $('#langCur').textContent = t.label;
  $('#langNext').textContent = LANG === 'zh' ? '/ EN' : '/ 中文';
  const el = $('#content');
  el.classList.add('loading');
  el.innerHTML = esc(t.loading);
}

function setLang(lang){
  LANG = lang;
  localStorage.setItem('firstdrop_lang', lang);
  renderStatic();
  load().catch(renderError);
}

function renderError(err){
  const el = $('#content');
  el.classList.remove('loading');
  el.innerHTML = `<div class="empty">${esc(T().loadFail)}${esc(err.message)}</div>`;
}

async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function load(){
  const t = T();
  const el = $('#content');
  const id = new URLSearchParams(location.search).get('id');
  if(!id){ el.classList.remove('loading'); el.innerHTML = `<div class="empty">${esc(t.missingId)}</div>`; return; }
  const d = await api('/api/event?id='+encodeURIComponent(id));
  const c = d.cluster || {};
  const s = d.earliest;
  const members = d.members || [];
  const maxHeat = Math.max(...members.map(m=>m.hot_value||0), 1);

  let html = `<div class="card">
    <h1>${esc(c.label||'—')}</h1>
    <div class="meta">
      <div class="meta-item">${esc(t.coveredPlatforms)} <b>${c.platform_count||0}</b></div>
      <div class="meta-item">${esc(t.topicCount)} <b>${c.topic_count||0}</b></div>
      <div class="meta-item">${esc(t.bestPosition)} <b>#${c.best_position||'—'}</b></div>
      <div class="meta-item">${esc(t.eventId)} <b>${c.cluster_id}</b></div>
    </div>
    <div class="plat-tags">${(c.platforms||'').split(',').filter(Boolean).map(p=>`<span class="plat-tag"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${PLAT_COLORS[p]||'var(--dim)'};margin-right:4px"></i>${esc(p)}</span>`).join('')}</div>
    <div class="heat">
      <span style="color:var(--dim);font-size:13px">${esc(t.peakHeat)}</span>
      <div class="heat-bar"><div class="heat-fill" style="width:${Math.min(100,Math.round((c.peak_hot||0)/maxHeat*100))}%"></div></div>
      <span class="heat-num">${fmt(c.peak_hot)}</span>
    </div>`;

  if(s && s.url){
    const dt = s.posted_at ? new Date(s.posted_at).toLocaleString(t.locale) : t.unknownTime;
    html += `<div class="section-title">${esc(t.secTrace)}</div>
    <div class="trace-box">
      <div class="trace-label">${esc(t.traceLabel)}</div>
      <div class="trace-title">${esc(s.title||'—')}</div>
      <div class="trace-meta">
        ${esc(t.source)}<a href="${esc(s.url)}" target="_blank">${esc(s.site||t.unknownSite)}</a> · ${esc(t.time)}${esc(dt)} · ${esc(t.confidence)} ${Math.round((s.confidence||0)*100)}%
        ${s.snapshot_path ? ` · <a href="/api/snapshot?path=${encodeURIComponent(s.snapshot_path)}" target="_blank">${esc(t.viewSnapshot)}</a>` : ''}
      </div>
      ${s.content_excerpt ? `<div class="trace-excerpt"><span class="trace-excerpt-label">${esc(t.excerptLabel)}</span>${esc(s.content_excerpt.slice(0,300))}${s.content_excerpt.length>300?'…':''}</div>` : ''}
    </div>`;
  }

  if(members.length){
    html += `<div class="section-title">${esc(t.secMembers)}</div>
      <div class="member-head">
        <span class="member-plat">${esc(t.colPlatform)}</span>
        <span class="member-title">${esc(t.colTitle)}</span>
        <span class="member-hot">${esc(t.colHeat)}</span>
        <span class="member-pos">${esc(t.colRank)}</span>
      </div>`;
    for(const m of members){
      html += `<div class="member">
        <span class="member-plat">${esc(m.platform_code)}</span>
        <span class="member-title">${esc(m.title||'—')}</span>
        <span class="member-hot">${fmt(m.hot_value)}</span>
        <span class="member-pos">#${m.position||'—'}</span>
      </div>`;
    }
  }

  html += `</div>`;
  el.classList.remove('loading');
  el.innerHTML = html;
}

$('#langSwitch').addEventListener('click', ()=> setLang(LANG === 'zh' ? 'en' : 'zh'));

renderStatic();
load().catch(renderError);
</script>
</body>
</html>
